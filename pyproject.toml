[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "neuroflight-lab"
version = "0.1.0"
description = "A reproducible research project for learning quadrotor control from scratch in simulation."
readme = "README.md"
requires-python = ">=3.12,<3.13"
dependencies = [
  "gym-pybullet-drones @ git+https://github.com/learnsyslab/gym-pybullet-drones.git@7ebad1ecabd28a7000add2d05f888aa2e837c2cc",
  # Declare Torch directly so uv can select the CPU-only index below.
  "torch>=2.13,<3",
]

[project.optional-dependencies]
dev = [
  "pytest>=9.0,<10",
  "ruff>=0.13,<1",
]

[project.scripts]
neuroflight-smoke = "neuroflight.smoke:main"

[tool.hatch.build.targets.wheel]
packages = ["src/neuroflight"]

[tool.hatch.metadata]
allow-direct-references = true

[tool.pytest.ini_options]
addopts = "-q"
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

[tool.uv.sources]
torch = { index = "pytorch-cpu" }
